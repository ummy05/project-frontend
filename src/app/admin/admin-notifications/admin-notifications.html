<div class="page-container">

    <!-- PAGE HEADER -->

    <div class="page-header">

        <div>
            <h2>Notifications</h2>
            <p>
                Stay updated with recent system activities.
            </p>
        </div>

        <button class="mark-btn">
            <i class="fas fa-check-double"></i>
            Mark All as Read
        </button>

    </div>

    <!-- SUMMARY -->

    <div class="summary-grid">

        <div class="summary-card">

            <i class="fas fa-bell"></i>

            <div>
                <h3>25</h3>
                <span>Total Notifications</span>
            </div>

        </div>

        <div class="summary-card">

            <i class="fas fa-envelope"></i>

            <div>
                <h3>8</h3>
                <span>Unread</span>
            </div>

        </div>

        <div class="summary-card">

            <i class="fas fa-exclamation-circle"></i>

            <div>
                <h3>3</h3>
                <span>Alerts</span>
            </div>

        </div>

    </div>

    <!-- NOTIFICATIONS LIST -->

    <div class="notifications-wrapper">

        <div class="notification-card"
             *ngFor="let notification of notifications"
             [class.unread]="notification.unread">

            <div class="notification-icon">

                <i class="fas fa-file-alt"
                   *ngIf="notification.type === 'license'"></i>

                <i class="fas fa-credit-card"
                   *ngIf="notification.type === 'payment'"></i>

                <i class="fas fa-exclamation-triangle"
                   *ngIf="notification.type === 'complaint'"></i>

                <i class="fas fa-triangle-exclamation"
                   *ngIf="notification.type === 'alert'"></i>

                <i class="fas fa-user"
                   *ngIf="notification.type === 'user'"></i>

            </div>

            <div class="notification-content">

                <div class="top-row">

                    <h4>{{notification.title}}</h4>

                    <span>{{notification.time}}</span>

                </div>

                <p>{{notification.message}}</p>

            </div>

        </div>

    </div>

</div>
