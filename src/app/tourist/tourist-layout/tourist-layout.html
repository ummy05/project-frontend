<div class="layout-container">


    <!-- ================================================= -->
    <!-- MOBILE OVERLAY -->
    <!-- ================================================= -->

    <div
        class="overlay"
        *ngIf="sidebarOpen"
        (click)="closeSidebar()">
    </div>


    <!-- ================================================= -->
    <!-- SIDEBAR -->
    <!-- ================================================= -->

    <aside
        class="sidebar"
        [class.active]="sidebarOpen">


        <!-- CLOSE BUTTON -->

        <button
            type="button"
            class="close-btn"
            (click)="closeSidebar()">

            <i class="fas fa-times"></i>

        </button>


        <!-- ================================================= -->
        <!-- LOGO -->
        <!-- ================================================= -->

        <div class="logo">

            <img
                src="/img/logo-1.png"
                alt="Coastal Monitor Logo">

            <div>

                <h2>
                    Coastal Monitor
                </h2>

                <span>
                    Tourist Portal
                </span>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- NAVIGATION -->
        <!-- ================================================= -->

        <nav>


            <!-- DASHBOARD -->

            <a
                routerLink="/tourist/dashboard"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                (click)="closeSidebar()">

                <i class="fas fa-home"></i>

                <span>
                    Dashboard
                </span>

            </a>

            <!-- PERMITS -->

            <a
                routerLink="/tourist/permits"
                routerLinkActive="active"
                (click)="closeSidebar()">

                <i class="fas fa-id-card"></i>

                <span>
                    Permits
                </span>

            </a>


            <!-- PAYMENTS -->

            <a
                routerLink="/tourist/payments"
                routerLinkActive="active"
                (click)="closeSidebar()">

                <i class="fas fa-credit-card"></i>

                <span>
                    Payments
                </span>

            </a>

            <a
                routerLink="/tourist/complaints"
                routerLinkActive="active"
                (click)="closeSidebar()">

                <i class="fas fa-file-lines"></i>

                <span>
                    Complaints
                </span>

            </a>


            <!-- PROFILE -->

            <a
                routerLink="/tourist/profile"
                routerLinkActive="active"
                (click)="closeSidebar()">

                <i class="fas fa-user"></i>

                <span>
                    Profile
                </span>

            </a>


            <!-- DIVIDER -->

            <div class="nav-divider"></div>


            <!-- LOGOUT -->

            <button
                type="button"
                class="logout-btn"
                (click)="logout()">

                <i class="fas fa-right-from-bracket"></i>

                <span>
                    Logout
                </span>

            </button>


        </nav>


        <!-- ================================================= -->
        <!-- USER CARD -->
        <!-- ================================================= -->

        <div class="profile-card">


            <div class="profile-avatar">

                <i class="fas fa-user"></i>

            </div>


            <div class="profile-info">

                <h4>
                    {{ fullName }}
                </h4>

                <span>
                    Tourist
                </span>

            </div>

        </div>

    </aside>


    <!-- ================================================= -->
    <!-- MAIN CONTENT -->
    <!-- ================================================= -->

    <div class="main-content">


        <!-- ================================================= -->
        <!-- TOPBAR -->
        <!-- ================================================= -->

        <header class="topbar">


            <!-- MOBILE MENU -->

            <button
                type="button"
                class="menu-btn"
                (click)="toggleSidebar()">

                <i class="fas fa-bars"></i>

            </button>


            <!-- WELCOME -->

            <div class="top-right">


                <div class="welcome">

                    <h3>
                        Welcome, {{ fullName }} 👋
                    </h3>

                    <span>
                        Protect our coastal environment
                    </span>

                </div>


                <!-- ACTIONS -->

                <div class="top-actions">


                    <!-- NOTIFICATIONS -->

                    <button
                        type="button"
                        class="notification-btn"
                        routerLink="/tourist/notifications"
                        aria-label="Notifications">

                        <i class="fas fa-bell"></i>

                    </button>


                    <!-- PROFILE -->

                    <button
                        type="button"
                        class="top-profile"
                        routerLink="/tourist/profile"
                        aria-label="Profile">

                        <i class="fas fa-user"></i>

                    </button>

                </div>

            </div>

        </header>


        <!-- ================================================= -->
        <!-- PAGE CONTENT -->
        <!-- ================================================= -->

        <main class="page-content">

            <router-outlet></router-outlet>

        </main>


    </div>

</div>
