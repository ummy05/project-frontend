<div class="layout-container">

    <!-- OVERLAY -->

    <div class="overlay"
         *ngIf="sidebarOpen"
         (click)="toggleSidebar()">
    </div>

    <!-- SIDEBAR -->

    <aside class="sidebar"
           [class.active]="sidebarOpen">

        <button class="close-btn"
                (click)="toggleSidebar()">

            <i class="fas fa-times"></i>

        </button>

        <div class="logo">

            <img src="/img/logo-1.png"
                 alt="Logo">

            <div>

                <h2>Coastal Monitor</h2>
                <span>Tourist Portal</span>

            </div>

        </div>

        <nav>

            <a routerLink="/tourist/dashboard"
               routerLinkActive="active">

                <i class="fas fa-home"></i>
                Dashboard

            </a>

            <a routerLink="/tourist/report-issue"
               routerLinkActive="active">

                <i class="fas fa-triangle-exclamation"></i>
                Report Issue

            </a>

            <a routerLink="/tourist/my-reports"
               routerLinkActive="active">

                <i class="fas fa-file-lines"></i>
                My Reports

            </a>

            <a routerLink="/tourist/notifications"
               routerLinkActive="active">

                <i class="fas fa-bell"></i>
                Notifications

            </a>

            <a routerLink="/tourist/profile"
               routerLinkActive="active">

                <i class="fas fa-user"></i>
                Profile

            </a>

            <a routerLink="/login">

                <i class="fas fa-right-from-bracket"></i>
                Logout

            </a>

        </nav>

        <div class="profile-card">

            <img src="/img/tourist.jpg">

            <div>

                <h4>John Smith</h4>
                <span>Tourist</span>

            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <div class="main-content">

        <header class="topbar">

            <button class="menu-btn"
                    (click)="toggleSidebar()">

                <i class="fas fa-bars"></i>

            </button>

            <div class="top-right">

                <div class="welcome">

                    <h3>Welcome 👋</h3>
                    <span>Protect our coastal environment</span>

                </div>

                <div class="top-actions">

                    <button>
                        <i class="fas fa-bell"></i>
                    </button>

                    <img src="/img/tourist.jpg">

                </div>

            </div>

        </header>

        <router-outlet></router-outlet>

    </div>

</div>
