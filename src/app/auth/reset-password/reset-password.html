<div class="auth-container">

    <div class="auth-card">

        <div class="icon-wrapper">

            <i class="fas fa-lock icon"></i>

        </div>


        <h2>
            Create New Password
        </h2>


        <p class="subtitle">

            Create a strong new password to
            secure your Coastal Monitor account.

        </p>


        <!-- NEW PASSWORD -->

        <div class="input-group">

            <label>
                New Password
            </label>

            <div class="input-wrapper">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    placeholder="Enter new password"
                    [(ngModel)]="newPassword"
                    autocomplete="new-password"
                    [disabled]="loading">

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="input-group">

            <label>
                Confirm Password
            </label>

            <div class="input-wrapper">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    placeholder="Confirm new password"
                    [(ngModel)]="confirmPassword"
                    autocomplete="new-password"
                    [disabled]="loading">

            </div>

        </div>


        <!-- ERROR -->

        <div
            class="error"
            *ngIf="error">

            <i class="fas fa-circle-exclamation"></i>

            {{ error }}

        </div>


        <!-- INFO -->

        <div class="password-info">

            <i class="fas fa-circle-info"></i>

            <span>
                Make sure your password is strong
                and easy for you to remember.
            </span>

        </div>


        <!-- BUTTON -->

        <button
            type="button"
            class="reset-btn"
            (click)="resetPassword()"
            [disabled]="loading">

            <i
                class="fas"
                [ngClass]="loading
                    ? 'fa-spinner fa-spin'
                    : 'fa-key'">
            </i>

            <span>

                {{ loading
                    ? 'Saving...'
                    : 'Reset Password'
                }}

            </span>

        </button>


        <div class="security-note">

            <i class="fas fa-shield-halved"></i>

            <span>
                Your password is securely protected.
            </span>

        </div>

    </div>

</div>
