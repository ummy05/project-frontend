<div class="auth-container">

<div class="auth-card">

<h2>Create New Password</h2>

<input

type="password"

placeholder="New Password"

[(ngModel)]="newPassword">

<input

type="password"

placeholder="Confirm Password"

[(ngModel)]="confirmPassword">

<div class="error" *ngIf="error">

{{error}}

</div>

<button

(click)="resetPassword()"

[disabled]="loading">

{{loading ? 'Saving...' : 'Reset Password'}}

</button>

</div>

</div>
